server 192.168.255.0 255.255.255.0
verb 3
key /etc/openvpn/pki/private/127.0.0.1.key
ca /etc/openvpn/pki/ca.crt
cert /etc/openvpn/pki/issued/127.0.0.1.crt
dh /etc/openvpn/pki/dh.pem
tls-auth /etc/openvpn/pki/ta.key
key-direction 0
keepalive 10 60
persist-key
persist-tun

proto udp
# Rely on Docker to do port mapping, internally always 1194
port 1194
dev tun0
status /tmp/openvpn-status.log

user nobody
group nogroup
comp-lzo no

### Route Configurations Below
# CTF machines live on the ctf_network (172.20.0.0/16). The openvpn
# container sits on that network (172.20.0.250, connected via eth0) and
# masquerades client traffic onto it, so no server-side route directive is
# needed here -- clients only need the pushed route below.

### Push Configurations Below
push "block-outside-dns"
push "dhcp-option DNS 8.8.8.8"
push "dhcp-option DNS 8.8.4.4"
push "comp-lzo no"
# Without this, clients bring up the tunnel but have no route into the
# CTF network and cannot reach any challenge machine.
push "route 172.20.0.0 255.255.0.0"
